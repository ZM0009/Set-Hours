<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SetHours">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>SetHours – TV Timesheet</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#101828;--muted:#667085;--line:#d0d5dd;--nav:#0b1220;--blue:#2563eb;--green:#079455;--red:#d92d20;--amber:#dc6803;--soft:#f8fafc}
*{box-sizing:border-box}html{background:var(--nav)}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}.app{max-width:760px;margin:auto}.top{padding:calc(14px + env(safe-area-inset-top)) 18px 15px;background:var(--nav);color:#fff;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;justify-content:space-between}.brand h1{font-size:21px;margin:0}.brand small{color:#98a2b3}.live-time{font-variant-numeric:tabular-nums;font-weight:800;font-size:17px}.page{display:none;padding:14px}.page.active{display:block}.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(16,24,40,.08)}.hero{background:linear-gradient(145deg,#111c31,#172b4d);color:#fff;padding:20px}.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#98a2b3;font-weight:800}.hero h2{margin:6px 0 2px;font-size:27px}.hero .elapsed{font-size:45px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.04em;margin:15px 0}.status{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.1);font-size:12px;font-weight:800}.dot{width:8px;height:8px;background:#75e0a7;border-radius:50%;box-shadow:0 0 0 5px rgba(117,224,167,.12)}.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--muted);font-weight:800;margin-bottom:5px}.hero .field label{color:#b9c3d3}input,select,textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;color:var(--ink);min-height:46px}textarea{min-height:72px;resize:vertical}.hero input,.hero select,.hero textarea{border-color:#344054}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary-btn,.secondary-btn,.danger-btn,.clock-btn{border:0;border-radius:14px;padding:13px 15px;font:inherit;font-weight:800;cursor:pointer}.primary-btn{background:var(--blue);color:#fff}.secondary-btn{background:#eaecf0;color:var(--ink)}.danger-btn{background:#fee4e2;color:#b42318}.clock-btn{width:100%;font-size:20px;padding:17px;background:#12b76a;color:#fff;box-shadow:0 7px 18px rgba(18,183,106,.22)}.clock-btn.out{background:#f04438;box-shadow:0 7px 18px rgba(240,68,56,.2)}.clock-btn.break{background:#f79009;box-shadow:none;font-size:16px;margin-top:9px}.clock-btn.resume{background:#12b76a}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-title h3{margin:0;font-size:18px}.link-btn{background:none;border:0;color:var(--blue);font:inherit;font-weight:800;padding:6px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{background:var(--soft);border-radius:13px;padding:12px}.metric span{font-size:11px;color:var(--muted);font-weight:700}.metric strong{display:block;font-size:20px;margin-top:3px}.shift{border-top:1px solid #eaecf0;padding:13px 0}.shift:first-of-type{border-top:0;padding-top:2px}.shift-row{display:flex;justify-content:space-between;gap:10px}.shift-title{font-weight:800}.shift-meta,.tiny{font-size:12px;color:var(--muted);margin-top:3px}.hours{font-weight:900;white-space:nowrap}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#eff8ff;color:#175cd3;font-size:11px;font-weight:800;margin-top:5px}.week-nav{display:flex;align-items:center;gap:8px}.week-label{text-align:center;flex:1;font-weight:800}.icon-btn{border:0;border-radius:11px;background:#eaecf0;padding:10px 14px;font-size:20px}.day{padding:12px 0;border-top:1px solid #eaecf0}.day:first-child{border-top:0}.day-head{display:flex;justify-content:space-between;align-items:center}.day-name{font-weight:900}.empty{text-align:center;padding:24px 8px;color:var(--muted)}.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid #d0d5dd;padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:flex;justify-content:center}.nav-inner{max-width:760px;width:100%;display:grid;grid-template-columns:repeat(4,1fr)}.tab{border:0;background:none;color:#667085;font:inherit;font-size:11px;font-weight:800;padding:5px 2px}.tab span{display:block;font-size:21px;margin-bottom:2px}.tab.active{color:var(--blue)}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1;min-width:120px}.modal{display:none;position:fixed;inset:0;background:rgba(16,24,40,.58);z-index:50;padding:20px;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:100%;max-width:720px;max-height:90vh;overflow:auto;background:#fff;border-radius:22px;padding:18px}.sheet h3{margin:0 0 12px}.sheet-actions{display:flex;gap:8px;margin-top:14px}.sheet-actions button{flex:1}.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#101828;color:#fff;padding:10px 15px;border-radius:999px;z-index:80;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1}@media(max-width:440px){.metrics{grid-template-columns:1fr 1fr}.metrics .metric:last-child{grid-column:1/-1}.hero .elapsed{font-size:40px}}@media print{.top,.bottom-nav,.no-print,.link-btn,.icon-btn{display:none!important}body{background:#fff;padding:0}.page{display:none!important}.page#printPage,.page.active#printPage{display:block!important;padding:0}.card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}.app{max-width:none}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div style="display:flex;align-items:center;gap:10px"><img src="icon-192.png" alt="" style="width:38px;height:38px;border-radius:10px"><div><h1>SetHours</h1><small>Television timesheet</small></div></div><div class="live-time" id="topClock">--:--</div></div></header>

<section class="page active" id="todayPage">
  <div class="card hero" id="clockCard"></div>
  <div class="card"><div class="section-title"><h3>This week</h3><button class="link-btn" onclick="showPage('weekPage')">View all</button></div><div class="metrics"><div class="metric"><span>WORKED</span><strong id="todayWeekHours">0.00h</strong></div><div class="metric"><span>OVERTIME</span><strong id="todayOt">0.00h</strong></div><div class="metric"><span>EST. PAY</span><strong id="todayPay">$0.00</strong></div></div></div>
  <div class="card"><div class="section-title"><h3>Recent shifts</h3><button class="link-btn" onclick="openShiftModal()">+ Add</button></div><div id="recentShifts"></div></div>
</section>

<section class="page" id="weekPage">
  <div class="card"><div class="week-nav"><button class="icon-btn" onclick="moveWeek(-1)">‹</button><div class="week-label" id="weekLabel"></div><button class="icon-btn" onclick="moveWeek(1)">›</button></div></div>
  <div class="card"><div class="metrics"><div class="metric"><span>TOTAL</span><strong id="weekTotal">0.00h</strong></div><div class="metric"><span>OVERTIME</span><strong id="weekOt">0.00h</strong></div><div class="metric"><span>EST. PAY</span><strong id="weekPay">$0.00</strong></div></div></div>
  <div class="card"><div class="section-title"><h3>Daily breakdown</h3><button class="link-btn" onclick="openShiftModal()">+ Add shift</button></div><div id="weekDays"></div></div>
  <div class="actions no-print"><button class="primary-btn" onclick="printWeek()">Print / Save PDF</button><button class="secondary-btn" onclick="exportCSV()">Export CSV</button></div>
</section>

<section class="page" id="historyPage">
  <div class="card"><div class="section-title"><h3>Production history</h3></div><div id="historyContent"></div></div>
</section>

<section class="page" id="settingsPage">
  <div class="card"><div class="section-title"><h3>Your details</h3></div>
    <div class="field"><label>Name</label><input id="setName" placeholder="Your name"></div>
    <div class="grid2"><div class="field"><label>Department</label><input id="setDept" placeholder="Games / Art / Camera"></div><div class="field"><label>Default role</label><input id="setRole" placeholder="Producer"></div></div>
  </div>
  <div class="card"><div class="section-title"><h3>Pay settings</h3></div>
    <div class="grid2"><div class="field"><label>Hourly rate</label><input id="setRate" type="number" step="0.01" min="0"></div><div class="field"><label>Currency symbol</label><input id="setCurrency" maxlength="3" placeholder="$"></div></div>
    <div class="grid2"><div class="field"><label>Weekly overtime after</label><input id="setOtAfter" type="number" step="0.5" min="0"></div><div class="field"><label>Overtime multiplier</label><input id="setOtMult" type="number" step="0.1" min="1"></div></div>
  </div>
  <div class="card"><div class="section-title"><h3>Productions</h3><button class="link-btn" onclick="addProduction()">+ Add</button></div><div id="productionList"></div></div>
  <div class="actions"><button class="primary-btn" onclick="saveSettings()">Save settings</button><button class="danger-btn" onclick="resetAll()">Erase all data</button></div>
</section>

<section class="page" id="printPage"></section>
</div>

<nav class="bottom-nav no-print"><div class="nav-inner"><button class="tab active" data-page="todayPage" onclick="showPage('todayPage')"><span>⏱</span>Today</button><button class="tab" data-page="weekPage" onclick="showPage('weekPage')"><span>▦</span>Week</button><button class="tab" data-page="historyPage" onclick="showPage('historyPage')"><span>◷</span>History</button><button class="tab" data-page="settingsPage" onclick="showPage('settingsPage')"><span>⚙</span>Settings</button></div></nav>

<div class="modal" id="shiftModal"><div class="sheet"><h3 id="shiftModalTitle">Add shift</h3><input type="hidden" id="editShiftId">
  <div class="field"><label>Date</label><input type="date" id="shiftDate"></div>
  <div class="grid2"><div class="field"><label>Call / Start</label><input type="time" id="shiftStart"></div><div class="field"><label>Wrap / Finish</label><input type="time" id="shiftEnd"></div></div>
  <div class="grid2"><div class="field"><label>Unpaid break (minutes)</label><input type="number" min="0" step="5" id="shiftBreak"></div><div class="field"><label>Travel hours</label><input type="number" min="0" step="0.25" id="shiftTravel"></div></div>
  <div class="field"><label>Production</label><input id="shiftProduction" list="productionsList" placeholder="Production name"><datalist id="productionsList"></datalist></div>
  <div class="grid2"><div class="field"><label>Role</label><input id="shiftRole" placeholder="Role"></div><div class="field"><label>Location</label><input id="shiftLocation" placeholder="Location"></div></div>
  <div class="field"><label>Notes / episode</label><textarea id="shiftNotes" placeholder="Episode, unit, allowances or notes"></textarea></div>
  <div class="sheet-actions"><button class="secondary-btn" onclick="closeModal()">Cancel</button><button class="primary-btn" onclick="saveShift()">Save shift</button></div>
  <button class="danger-btn" id="deleteShiftBtn" style="width:100%;margin-top:8px;display:none" onclick="deleteShift()">Delete shift</button>
</div></div>
<div class="toast" id="toast"></div>

<script>
const KEY='sethours_v2';
const defaultData={settings:{name:'',department:'',role:'',rate:0,currency:'$',otAfter:40,otMult:1.5,productions:['Untitled Production']},shifts:[],active:null};
let state=load();let viewedMonday=getMonday(new Date());
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x?{...defaultData,...x,settings:{...defaultData.settings,...x.settings}}:structuredClone(defaultData)}catch{return structuredClone(defaultData)}}
function persist(){localStorage.setItem(KEY,JSON.stringify(state))}
function pad(n){return String(n).padStart(2,'0')}
function localDate(d=new Date()){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function localTime(d=new Date()){return `${pad(d.getHours())}:${pad(d.getMinutes())}`}
function parseLocal(date,time){const [y,m,da]=date.split('-').map(Number),[h,mi]=time.split(':').map(Number);return new Date(y,m-1,da,h,mi)}
function getMonday(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()+(x.getDay()===0?-6:1-x.getDay()));return x}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function fmtDate(d,opts={day:'numeric',month:'short'}){return new Intl.DateTimeFormat(undefined,opts).format(d)}
function duration(s){if(!s.start||!s.end)return 0;let a=parseLocal(s.date,s.start),b=parseLocal(s.date,s.end);if(b<a)b.setDate(b.getDate()+1);return Math.max(0,(b-a)/36e5-(Number(s.breakMins)||0)/60)+(Number(s.travel)||0)}
function weekShifts(m=viewedMonday){const end=addDays(m,7);return state.shifts.filter(s=>{const d=parseLocal(s.date,'00:00');return d>=m&&d<end}).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start))}
function weekStats(m=viewedMonday){const shifts=weekShifts(m),total=shifts.reduce((n,s)=>n+duration(s),0),ot=Math.max(0,total-Number(state.settings.otAfter||40)),reg=total-ot,pay=reg*Number(state.settings.rate||0)+ot*Number(state.settings.rate||0)*Number(state.settings.otMult||1.5);return{shifts,total,ot,reg,pay}}
function money(n){return `${state.settings.currency||'$'}${n.toFixed(2)}`}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showPage(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.page===id));if(id==='weekPage')renderWeek();if(id==='historyPage')renderHistory();if(id==='settingsPage')renderSettings();scrollTo(0,0)}
function clockElapsed(){if(!state.active)return'00:00:00';let end=new Date(),start=new Date(state.active.startedAt),breakMs=state.active.breakMs||0;if(state.active.breakStartedAt)breakMs+=end-new Date(state.active.breakStartedAt);let sec=Math.max(0,Math.floor((end-start-breakMs)/1000));return`${pad(Math.floor(sec/3600))}:${pad(Math.floor(sec%3600/60))}:${pad(sec%60)}`}
function tick(){const n=new Date();document.getElementById('topClock').textContent=n.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});const el=document.getElementById('elapsed');if(el)el.textContent=clockElapsed()}
function renderClock(){const a=state.active,productions=state.settings.productions||[];document.getElementById('productionsList').innerHTML=productions.map(p=>`<option value="${esc(p)}">`).join('');let html='';if(!a){html=`<div class="eyebrow">Ready for set</div><h2>${esc(state.settings.name)||'Today’s shift'}</h2><div class="elapsed" id="elapsed">00:00:00</div><div class="field"><label>Production</label><input id="clockProduction" list="productionsList" value="${esc(productions[0]||'')}" placeholder="Production name"></div><div class="grid2"><div class="field"><label>Role</label><input id="clockRole" value="${esc(state.settings.role)}" placeholder="Role"></div><div class="field"><label>Location</label><input id="clockLocation" placeholder="Location"></div></div><button class="clock-btn" onclick="clockIn()">Clock In</button>`}else{const breaking=!!a.breakStartedAt;html=`<div class="eyebrow">${breaking?'Meal break':'Currently working'}</div><h2>${esc(a.production||'Current shift')}</h2><div class="status"><span class="dot"></span>${breaking?'BREAK RUNNING':'CLOCKED IN'}</div><div class="elapsed" id="elapsed">${clockElapsed()}</div><div class="tiny" style="color:#b9c3d3">Started ${new Date(a.startedAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}${a.location?' · '+esc(a.location):''}</div><button class="clock-btn out" onclick="clockOut()">Clock Out</button><button class="clock-btn break ${breaking?'resume':''}" onclick="toggleBreak()">${breaking?'End Break':'Start Break'}</button>`}document.getElementById('clockCard').innerHTML=html}
function clockIn(){state.active={startedAt:new Date().toISOString(),production:document.getElementById('clockProduction').value.trim(),role:document.getElementById('clockRole').value.trim(),location:document.getElementById('clockLocation').value.trim(),breakMs:0,breakStartedAt:null};persist();renderAll();toast('Clocked in')}
function toggleBreak(){const a=state.active;if(!a)return;if(a.breakStartedAt){a.breakMs=(a.breakMs||0)+(new Date()-new Date(a.breakStartedAt));a.breakStartedAt=null;toast('Break ended')}else{a.breakStartedAt=new Date().toISOString();toast('Break started')}persist();renderClock()}
function clockOut(){const a=state.active;if(!a)return;const now=new Date();if(a.breakStartedAt){a.breakMs=(a.breakMs||0)+(now-new Date(a.breakStartedAt));a.breakStartedAt=null}const start=new Date(a.startedAt);state.shifts.push({id:crypto.randomUUID(),date:localDate(start),start:localTime(start),end:localTime(now),breakMins:Math.round((a.breakMs||0)/60000),travel:0,production:a.production,role:a.role,location:a.location,notes:''});state.active=null;persist();viewedMonday=getMonday(now);renderAll();toast('Shift saved')}
function renderToday(){const m=getMonday(new Date()),st=weekStats(m);document.getElementById('todayWeekHours').textContent=st.total.toFixed(2)+'h';document.getElementById('todayOt').textContent=st.ot.toFixed(2)+'h';document.getElementById('todayPay').textContent=money(st.pay);const rec=[...state.shifts].sort((a,b)=>(b.date+b.start).localeCompare(a.date+a.start)).slice(0,4);document.getElementById('recentShifts').innerHTML=rec.length?rec.map(shiftHTML).join(''):'<div class="empty">No shifts recorded yet.</div>'}
function shiftHTML(s){return`<div class="shift" onclick="openShiftModal('${s.id}')"><div class="shift-row"><div><div class="shift-title">${esc(s.production||'Production')}</div><div class="shift-meta">${fmtDate(parseLocal(s.date,'00:00'),{weekday:'short',day:'numeric',month:'short'})} · ${s.start}–${s.end}${s.role?' · '+esc(s.role):''}</div>${Number(s.travel)>0?'<span class="pill">Includes '+Number(s.travel).toFixed(2)+'h travel</span>':''}</div><div class="hours">${duration(s).toFixed(2)}h</div></div></div>`}
function moveWeek(n){viewedMonday=addDays(viewedMonday,n*7);renderWeek()}
function renderWeek(){const sun=addDays(viewedMonday,6),st=weekStats();document.getElementById('weekLabel').textContent=`${fmtDate(viewedMonday)} – ${fmtDate(sun,{day:'numeric',month:'short',year:'numeric'})}`;document.getElementById('weekTotal').textContent=st.total.toFixed(2)+'h';document.getElementById('weekOt').textContent=st.ot.toFixed(2)+'h';document.getElementById('weekPay').textContent=money(st.pay);let html='';for(let i=0;i<7;i++){const d=addDays(viewedMonday,i),ds=localDate(d),arr=st.shifts.filter(s=>s.date===ds),tot=arr.reduce((n,s)=>n+duration(s),0);html+=`<div class="day"><div class="day-head"><div class="day-name">${fmtDate(d,{weekday:'long',day:'numeric',month:'short'})}</div><div class="hours">${tot.toFixed(2)}h</div></div>${arr.map(shiftHTML).join('')||'<div class="tiny">No shift</div>'}</div>`}document.getElementById('weekDays').innerHTML=html}
function renderHistory(){const groups={};state.shifts.forEach(s=>{const k=s.production||'Unassigned';groups[k]=groups[k]||[];groups[k].push(s)});const keys=Object.keys(groups).sort();document.getElementById('historyContent').innerHTML=keys.length?keys.map(k=>{const h=groups[k].reduce((n,s)=>n+duration(s),0);return`<div class="shift"><div class="shift-row"><div><div class="shift-title">${esc(k)}</div><div class="shift-meta">${groups[k].length} shift${groups[k].length===1?'':'s'}</div></div><div class="hours">${h.toFixed(2)}h</div></div></div>`}).join(''):'<div class="empty">Production totals will appear here.</div>'}
function renderSettings(){const s=state.settings;setName.value=s.name;setDept.value=s.department;setRole.value=s.role;setRate.value=s.rate;setCurrency.value=s.currency;setOtAfter.value=s.otAfter;setOtMult.value=s.otMult;productionList.innerHTML=(s.productions||[]).map((p,i)=>`<div class="shift"><div class="shift-row"><div class="shift-title">${esc(p)}</div><button class="danger-btn" onclick="removeProduction(${i})">Remove</button></div></div>`).join('')||'<div class="empty">Add your first production.</div>'}
function saveSettings(){state.settings={...state.settings,name:setName.value.trim(),department:setDept.value.trim(),role:setRole.value.trim(),rate:Number(setRate.value)||0,currency:setCurrency.value.trim()||'$',otAfter:Number(setOtAfter.value)||40,otMult:Number(setOtMult.value)||1.5};persist();renderAll();toast('Settings saved')}
function addProduction(){const p=prompt('Production name');if(p&&p.trim()){state.settings.productions=[...new Set([...(state.settings.productions||[]),p.trim()])];persist();renderSettings();renderClock()}}
function removeProduction(i){state.settings.productions.splice(i,1);persist();renderSettings();renderClock()}
function openShiftModal(id=''){const s=state.shifts.find(x=>x.id===id);editShiftId.value=s?.id||'';shiftModalTitle.textContent=s?'Edit shift':'Add shift';shiftDate.value=s?.date||localDate();shiftStart.value=s?.start||'08:00';shiftEnd.value=s?.end||'18:00';shiftBreak.value=s?.breakMins||0;shiftTravel.value=s?.travel||0;shiftProduction.value=s?.production||state.settings.productions?.[0]||'';shiftRole.value=s?.role||state.settings.role||'';shiftLocation.value=s?.location||'';shiftNotes.value=s?.notes||'';deleteShiftBtn.style.display=s?'block':'none';shiftModal.classList.add('show')}
function closeModal(){shiftModal.classList.remove('show')}
function saveShift(){if(!shiftDate.value||!shiftStart.value||!shiftEnd.value){alert('Please enter the date, start and finish times.');return}const obj={id:editShiftId.value||crypto.randomUUID(),date:shiftDate.value,start:shiftStart.value,end:shiftEnd.value,breakMins:Number(shiftBreak.value)||0,travel:Number(shiftTravel.value)||0,production:shiftProduction.value.trim(),role:shiftRole.value.trim(),location:shiftLocation.value.trim(),notes:shiftNotes.value.trim()};const i=state.shifts.findIndex(x=>x.id===obj.id);if(i>=0)state.shifts[i]=obj;else state.shifts.push(obj);if(obj.production&&!state.settings.productions.includes(obj.production))state.settings.productions.push(obj.production);persist();closeModal();renderAll();toast('Shift saved')}
function deleteShift(){const id=editShiftId.value;if(confirm('Delete this shift?')){state.shifts=state.shifts.filter(x=>x.id!==id);persist();closeModal();renderAll();toast('Shift deleted')}}
function exportCSV(){const st=weekStats(),rows=[['Date','Production','Role','Location','Start','Finish','Break Minutes','Travel Hours','Paid Hours','Notes']];st.shifts.forEach(s=>rows.push([s.date,s.production,s.role,s.location,s.start,s.end,s.breakMins,s.travel,duration(s).toFixed(2),s.notes]));rows.push([]);rows.push(['Weekly Total',st.total.toFixed(2)]);rows.push(['Overtime',st.ot.toFixed(2)]);rows.push(['Estimated Pay',money(st.pay)]);const csv=rows.map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\n');downloadBlob(csv,`SetHours_${localDate(viewedMonday)}.csv`,'text/csv')}
function downloadBlob(text,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function printWeek(){const st=weekStats(),sun=addDays(viewedMonday,6);printPage.innerHTML=`<div class="card"><h1>Television Timesheet</h1><p><strong>${esc(state.settings.name||'Name')}</strong>${state.settings.department?' · '+esc(state.settings.department):''}</p><p>Week: ${fmtDate(viewedMonday)} – ${fmtDate(sun,{day:'numeric',month:'short',year:'numeric'})}</p></div><div class="card"><table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr><th align="left">Date</th><th align="left">Production</th><th>Start</th><th>Finish</th><th>Break</th><th>Travel</th><th align="right">Hours</th></tr></thead><tbody>${st.shifts.map(s=>`<tr style="border-top:1px solid #ddd"><td style="padding:8px 0">${s.date}</td><td>${esc(s.production)}</td><td align="center">${s.start}</td><td align="center">${s.end}</td><td align="center">${s.breakMins||0}m</td><td align="center">${Number(s.travel||0).toFixed(2)}</td><td align="right"><strong>${duration(s).toFixed(2)}</strong></td></tr>`).join('')}</tbody></table></div><div class="card"><p><strong>Total:</strong> ${st.total.toFixed(2)} hours &nbsp; <strong>Overtime:</strong> ${st.ot.toFixed(2)} hours &nbsp; <strong>Estimated pay:</strong> ${money(st.pay)}</p><br><p>Worker signature: ____________________________</p><br><p>Supervisor approval: ________________________</p></div>`;showPage('printPage');setTimeout(()=>{window.print();showPage('weekPage')},100)}
function resetAll(){if(confirm('Erase all settings, shifts and the active timer? This cannot be undone.')){state=structuredClone(defaultData);persist();renderAll();showPage('todayPage');toast('All data erased')}}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700)}
function renderAll(){renderClock();renderToday();renderWeek();renderHistory();if(document.getElementById('settingsPage').classList.contains('active'))renderSettings()}
shiftModal.addEventListener('click',e=>{if(e.target===shiftModal)closeModal()});
setInterval(tick,1000);tick();renderAll();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
</script>
